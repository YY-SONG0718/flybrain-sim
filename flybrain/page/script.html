<script>
(function(){
const D = window.__EPISODE__;
const N = D.times.length;
const HZ = D.rate_max / 255;
const DISPLAY_MAX = 150;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const BANDS = ['#3987e5','#d55181','#199e70','#c98500','#9085e9','#d95926'];
const bandNames = [...new Set(D.segments.map(s => s[2].replace(/ \d+ Hz$/, '')))];
const bandColour = lab => BANDS[bandNames.indexOf(lab.replace(/ \d+ Hz$/, '')) % BANDS.length];
const DPR = () => Math.min(2.5, window.devicePixelRatio || 1);

/* size a canvas to its box in CSS pixels, so text stays legible at any width */
function fit(cv, aspect, maxH){
  const w = Math.max(180, cv.clientWidth || cv.parentElement.clientWidth);
  const h = Math.min(maxH || 1e9, w * aspect);
  const d = DPR();
  cv.width = Math.round(w * d);
  cv.height = Math.round(h * d);
  cv.style.height = h + 'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(d, 0, 0, d, 0, 0);
  return {w, h, ctx};
}

/* ---------- brain views ---------- */
function makeView(canvasId, key){
  const cv = document.getElementById(canvasId);
  const V = D.views[key];
  let ctx, W, H, S, bg;
  function resize(){
    const f = fit(cv, V.h / V.w);
    ctx = f.ctx; W = f.w; H = f.h; S = W / V.w;
    const d = DPR();
    bg = document.createElement('canvas');
    bg.width = cv.width; bg.height = cv.height;
    const bx = bg.getContext('2d');
    bx.setTransform(d, 0, 0, d, 0, 0);
    bx.fillStyle = '#000'; bx.fillRect(0, 0, W, H);
    bx.fillStyle = 'rgba(150,158,175,0.26)';
    const r = Math.max(0.8, S * 0.9);
    for(const [x, y] of V.bg) bx.fillRect(x * S, y * S, r, r);
  }
  function draw(rates){
    ctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
    ctx.drawImage(bg, 0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    const scale = Math.max(0.55, S);
    for(let i = 0; i < V.xy.length; i++){
      if(i === D.mn9_slot) continue;            // MN9 is drawn separately, in its own colour
      const q = rates[i];
      if(!q) continue;
      const a = Math.min(1, 0.30 + 0.70 * q * HZ / DISPLAY_MAX);
      const px = V.xy[i][0] * S, py = V.xy[i][1] * S;
      const rad = (2 + 5 * a) * scale;
      const g = ctx.createRadialGradient(px, py, 0, px, py, rad);
      g.addColorStop(0,    `rgba(232,242,255,${0.9 * a})`);
      g.addColorStop(0.35, `rgba(87,150,232,${0.55 * a})`);
      g.addColorStop(1,    'rgba(18,36,59,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(px, py, rad, 0, 6.2832); ctx.fill();
    }
    // MN9: orange, and driven only by its own rate -- so a glow here means MN9 fired,
    // not one of the ~100 neighbours that a marker ring this size would enclose.
    if(D.mn9_slot < 0){ ctx.globalCompositeOperation = 'source-over'; return; }
    const mx = V.xy[D.mn9_slot][0] * S, my = V.xy[D.mn9_slot][1] * S;
    const qm = rates[D.mn9_slot];
    if(qm){
      const a = Math.min(1, 0.35 + 0.65 * qm * HZ / DISPLAY_MAX);
      const rad = (2.5 + 5.5 * a) * scale;
      const g = ctx.createRadialGradient(mx, my, 0, mx, my, rad);
      g.addColorStop(0,    `rgba(255,241,230,${0.95 * a})`);
      g.addColorStop(0.35, `rgba(240,121,63,${0.65 * a})`);
      g.addColorStop(1,    'rgba(58,26,12,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(mx, my, rad, 0, 6.2832); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    // a tick and a leader line to an offset label, not a ring
    ctx.strokeStyle = css('--motor'); ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(mx - 4, my); ctx.lineTo(mx + 4, my);
    ctx.moveTo(mx, my - 4); ctx.lineTo(mx, my + 4);
    ctx.stroke();
    const lx = mx + 30, ly = my - 20;
    ctx.beginPath(); ctx.moveTo(mx + 4, my - 3); ctx.lineTo(lx - 3, ly + 3); ctx.stroke();
    ctx.font = '500 11px "IBM Plex Mono", ui-monospace, monospace';
    ctx.fillStyle = css('--motor');
    ctx.textAlign = 'left';
    ctx.fillText(D.readout_name || 'MN9', lx, ly);
  }
  return {resize, draw};
}
const frontal = makeView('frontal', 'frontal');
const dorsal  = makeView('dorsal', 'dorsal');

/* ---------- body ---------- */
const bodyCv = document.getElementById('body');
let bctx, bW, bH;
function resizeBody(){ const f = fit(bodyCv, 1.13, 420); bctx = f.ctx; bW = f.w; bH = f.h; }
function poly(pts, fill, stroke){
  bctx.beginPath();
  bctx.moveTo(pts[0][0], pts[0][1]);
  for(let i = 1; i < pts.length; i++) bctx.lineTo(pts[i][0], pts[i][1]);
  bctx.closePath();
  bctx.fillStyle = fill; bctx.fill();
  bctx.strokeStyle = stroke; bctx.lineWidth = 1.2; bctx.stroke();
}
function ellipse(cx, cy, rx, ry, rot){
  const p = [];
  for(let i = 0; i <= 44; i++){
    const t = i / 44 * 6.2832, x = rx * Math.cos(t), y = ry * Math.sin(t);
    const c = Math.cos(rot), s = Math.sin(rot);
    p.push([cx + x * c - y * s, cy + x * s + y * c]);
  }
  return p;
}
function capsule(p0, p1, r){
  const a = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]), p = [];
  for(let i = 0; i <= 16; i++){ const t = a + Math.PI / 2 + i / 16 * Math.PI; p.push([p0[0] + r * Math.cos(t), p0[1] + r * Math.sin(t)]); }
  for(let i = 0; i <= 16; i++){ const t = a - Math.PI / 2 + i / 16 * Math.PI; p.push([p1[0] + r * Math.cos(t), p1[1] + r * Math.sin(t)]); }
  return p;
}
// when the readout isn't MN9 the right panel shows the loudest motor/descending neurons instead
const OUT_SLOTS = (() => {
  const s = []; for(let i = 0; i < D.active.cls.length; i++) if(D.active.cls[i] === 'motor' || D.active.cls[i] === 'descending') s.push(i);
  const mean = i => D.active.rates.reduce((a, r) => a + r[i], 0);
  return s.sort((a, b) => mean(b) - mean(a)).slice(0, 8);
})();
function drawOutputs(k){
  bctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
  bctx.clearRect(0, 0, bW, bH);
  const rates = D.active.rates[k];
  const padL = 150, padR = 18, top = 22, rowH = Math.min(38, (bH - top - 30) / Math.max(1, OUT_SLOTS.length));
  const maxHz = Math.max(60, ...OUT_SLOTS.map(i => Math.max(...D.active.rates.map(r => r[i])) * HZ));
  bctx.font = '400 11px "IBM Plex Mono", ui-monospace, monospace';
  OUT_SLOTS.forEach((i, r) => {
    const y = top + r * rowH;
    const hz = rates[i] * HZ, w = (bW - padL - padR) * Math.min(1, hz / maxHz);
    bctx.fillStyle = i === D.mn9_slot ? css('--motor') : 'rgba(150,158,175,0.55)';
    bctx.fillRect(padL, y + 6, Math.max(0, w), rowH - 14);
    bctx.fillStyle = css('--scope-ink2'); bctx.textAlign = 'right';
    bctx.fillText(D.active.label[i].split(' (')[0].slice(0, 16), padL - 8, y + rowH / 2 + 3);
    bctx.fillStyle = css('--scope-ink'); bctx.textAlign = 'left';
    if(hz) bctx.fillText(Math.round(hz) + ' Hz', padL + Math.max(0, w) + 6, y + rowH / 2 + 3);
  });
  bctx.textAlign = 'left';
}
function drawBody(e){
  if(!D.body){ return drawOutputs(k); }
  bctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
  bctx.clearRect(0, 0, bW, bH);
  const sc = bW / 3.6, ox = bW * 0.46, oy = bH * 0.26;
  const P = (x, y) => [ox + x * sc, oy + y * sc];
  const T = pts => pts.map(([x, y]) => P(x, y));

  bctx.strokeStyle = css('--scope-line'); bctx.lineWidth = 2.5;
  bctx.beginPath(); bctx.moveTo(...P(-1.45, 2.03)); bctx.lineTo(...P(1.75, 2.03)); bctx.stroke();

  const a1 = (-118 + 46 * e) * Math.PI / 180, L1 = 0.42 + 0.30 * e;
  const base = [0.02, 0.62];
  const j1 = [base[0] + L1 * Math.cos(a1), base[1] - L1 * Math.sin(a1)];
  const a2 = a1 + (96 - 88 * e) * Math.PI / 180, L2 = 0.26 + 0.34 * e;
  const j2 = [j1[0] + L2 * Math.cos(a2), j1[1] - L2 * Math.sin(a2)];
  const touching = j2[1] > 1.72;

  poly(T(ellipse(0, 0, 1.00, 0.92, 0)), '#3c3b36', '#6f6e68');
  poly(T(ellipse(0.42, 0.16, 0.46, 0.60, 0)), '#7a4436', '#a9614c');
  poly(T(ellipse(0.16, -0.40, 0.15, 0.22, 0)), '#4a4942', '#6f6e68');
  poly(T(capsule(base, j1, 0.145 - 0.02 * e)), '#6b6a60', '#a2a094');
  poly(T(capsule(j1, j2, 0.105 - 0.015 * e)), '#7d7b70', '#b3b1a3');
  const sp = 0.06 + 0.14 * e, n2 = [-Math.sin(a2), -Math.cos(a2)];
  poly(T(ellipse(j2[0] + sp * n2[0], j2[1] + sp * n2[1], 0.15, 0.10, a2)), '#9a9788', '#d6d3c2');
  poly(T(ellipse(j2[0] - sp * n2[0], j2[1] - sp * n2[1], 0.15, 0.10, a2)), '#9a9788', '#d6d3c2');

  const [dx, dy] = P(0.55, 1.92);
  bctx.fillStyle = css('--sugar');
  bctx.globalAlpha = touching ? 1 : 0.5;
  bctx.beginPath(); bctx.arc(dx, dy, touching ? 9 : 6.5, 0, 6.2832); bctx.fill();
  bctx.globalAlpha = 1;
  bctx.font = '500 11px "IBM Plex Mono", ui-monospace, monospace';
  bctx.fillStyle = css('--sugar'); bctx.textAlign = 'right';
  bctx.fillText('sugar droplet', dx - 13, dy + 4);
  bctx.textAlign = 'left';
}

/* ---------- trace ---------- */
const tcv = document.getElementById('trace');
let tctx, tW, tH, PAD;
const T_END = D.times[N - 1] + D.bin;
const Y_MAX = Math.max(120, Math.max(...D.mn9) * 1.1);
const tx = t => PAD.l + t / T_END * (tW - PAD.l - PAD.r);
const ty = v => tH - PAD.b - v / Y_MAX * (tH - PAD.t - PAD.b);
function resizeTrace(){
  const f = fit(tcv, 0.26, 230);
  tctx = f.ctx; tW = f.w; tH = Math.max(150, f.h);
  tcv.style.height = tH + 'px';
  tcv.height = Math.round(tH * DPR());
  tctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
  PAD = {l: 46, r: 14, t: 20, b: 30};
}
function drawTrace(k){
  tctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
  tctx.clearRect(0, 0, tW, tH);
  tctx.font = '500 11px "IBM Plex Mono", ui-monospace, monospace';
  for(const [t0, t1, lab] of D.segments){
    tctx.fillStyle = bandColour(lab);
    tctx.globalAlpha = 0.13;
    tctx.fillRect(tx(t0), PAD.t, tx(t1) - tx(t0), tH - PAD.t - PAD.b);
    tctx.globalAlpha = 1;
    tctx.textAlign = 'center';
    tctx.fillText(lab, (tx(t0) + tx(t1)) / 2, PAD.t - 6);
  }
  const step = Y_MAX > 180 ? 100 : 50;
  tctx.textAlign = 'right';
  tctx.font = '400 11px "IBM Plex Mono", ui-monospace, monospace';
  for(let v = 0; v <= Y_MAX; v += step){
    tctx.strokeStyle = css('--line-soft'); tctx.lineWidth = 1;
    tctx.beginPath(); tctx.moveTo(PAD.l, ty(v)); tctx.lineTo(tW - PAD.r, ty(v)); tctx.stroke();
    tctx.fillStyle = css('--ink3'); tctx.fillText(v, PAD.l - 8, ty(v) + 4);
  }
  tctx.save();
  tctx.translate(13, tH / 2); tctx.rotate(-Math.PI / 2);
  tctx.textAlign = 'center'; tctx.fillStyle = css('--ink2');
  tctx.fillText('MN9 (Hz)', 0, 0);
  tctx.restore();
  tctx.textAlign = 'center'; tctx.fillStyle = css('--ink3');
  const tstep = tW < 480 ? 1.0 : 0.5;
  for(let t = 0; t <= T_END; t += tstep) tctx.fillText(t.toFixed(1), tx(t), tH - PAD.b + 17);
  tctx.textAlign = 'left';

  tctx.strokeStyle = css('--motor'); tctx.lineWidth = 2;
  tctx.lineJoin = 'round'; tctx.lineCap = 'round';
  tctx.beginPath();
  for(let i = 0; i <= k; i++){
    const X = tx(D.times[i]), Y = ty(D.mn9[i]);
    i ? tctx.lineTo(X, Y) : tctx.moveTo(X, Y);
  }
  tctx.stroke();
  tctx.strokeStyle = css('--ink2'); tctx.lineWidth = 1;
  tctx.beginPath(); tctx.moveTo(tx(D.times[k]), PAD.t); tctx.lineTo(tx(D.times[k]), tH - PAD.b); tctx.stroke();
  tctx.fillStyle = css('--motor');
  tctx.beginPath(); tctx.arc(tx(D.times[k]), ty(D.mn9[k]), 4, 0, 6.2832); tctx.fill();
}

/* ---------- table ---------- */
const tbody = document.getElementById('tbody');
function drawTable(rates){
  const order = [];
  for(let i = 0; i < rates.length; i++) if(rates[i]) order.push(i);
  order.sort((a, b) => rates[b] - rates[a]);
  const rows = order.slice(0, 8);
  if(!rows.length){
    tbody.innerHTML = '<tr><td colspan="4" style="color:var(--ink3)">Nothing is firing — the brain is at rest.</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(i => {
    const type = D.active.label[i].split(' (')[0];
    return `<tr class="${i === D.mn9_slot ? 'mn9' : ''}"><td class="type">${type}</td>`
         + `<td>${D.active.cls[i]}</td><td class="num">${D.active.root_id[i]}</td>`
         + `<td class="num">${Math.round(rates[i] * HZ)} Hz</td></tr>`;
  }).join('');
}

/* ---------- drive ---------- */
const scrub = document.getElementById('scrub');
const playBtn = document.getElementById('play');
const clock = document.getElementById('clock');
const stateEl = document.getElementById('state');
const rMn9 = document.getElementById('r-mn9');
const rAct = document.getElementById('r-active');
scrub.max = N - 1;
let k = 0, playing = false, timer = null;

function render(){
  const rates = D.active.rates[k];
  frontal.draw(rates); dorsal.draw(rates); drawBody(D.extension[k]); drawTrace(k); drawTable(rates);
  clock.textContent = 't = ' + D.times[k].toFixed(2) + ' s';
  const seg = D.segments.find(([a, b]) => D.times[k] >= a && D.times[k] < b);
  const on = D.segments.filter(([a, b]) => D.times[k] >= a && D.times[k] < b).map(s => s[2]);
  stateEl.dataset.s = on.length ? 'on' : 'none';
  stateEl.style.color = on.length ? bandColour(on[0]) : '';
  stateEl.textContent = on.length ? on.join(' + ') : 'no stimulus';
  rMn9.textContent = Math.round(D.mn9[k]) + ' Hz';
  let n = 0; for(const v of rates) if(v) n++;
  rAct.textContent = n;
  if(+scrub.value !== k) scrub.value = k;
}
function layout(){ frontal.resize(); dorsal.resize(); resizeBody(); resizeTrace(); render(); }
function tick(){ k = (k + 1) % N; render(); }
function setPlaying(on){
  playing = on;
  playBtn.textContent = on ? 'Pause' : 'Play';
  clearInterval(timer);
  if(on) timer = setInterval(tick, 55);
}
playBtn.addEventListener('click', () => setPlaying(!playing));
scrub.addEventListener('input', () => { setPlaying(false); k = +scrub.value; render(); });
let dragging = false;
function fromEvent(ev){
  const r = tcv.getBoundingClientRect();
  const x = (ev.clientX - r.left) / r.width * tW;
  const t = (x - PAD.l) / (tW - PAD.l - PAD.r) * T_END;
  k = Math.max(0, Math.min(N - 1, Math.round(t / D.bin)));
  render();
}
tcv.addEventListener('pointerdown', e => { dragging = true; setPlaying(false); tcv.setPointerCapture(e.pointerId); fromEvent(e); });
tcv.addEventListener('pointermove', e => { if(dragging) fromEvent(e); });
tcv.addEventListener('pointerup', () => { dragging = false; });
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 140); });
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);

// open on the peak of the sugar response, so the page shows the reflex at rest
let best = 0;
for(let i = 0; i < N; i++){
  if(D.mn9[i] > D.mn9[best]) best = i;
}
k = best;
if(document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
layout();
})();
</script>
