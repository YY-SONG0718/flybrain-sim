<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;1,400&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#f4f3ef; --surface:#fbfaf7; --line:#dfddd4; --line-soft:#ecebe4;
  --ink:#16181c; --ink2:#5c5f68; --ink3:#8b8e97;
  --scope:#0e1118; --scope-line:#232936; --scope-ink:#cfd6e4; --scope-ink2:#8891a3;
  --sugar:#2a6fd6; --bitter:#c2477f; --motor:#d95926; --quiet:#7f828c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#0b0d12; --surface:#12151c; --line:#242a35; --line-soft:#1a1f28;
    --ink:#eceff5; --ink2:#99a2b2; --ink3:#6d7482;
    --scope:#080a0f; --scope-line:#1d232e; --scope-ink:#cfd6e4; --scope-ink2:#8891a3;
    --sugar:#4d94ef; --bitter:#e06fa4; --motor:#f0793f; --quiet:#7a808c;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#0b0d12; --surface:#12151c; --line:#242a35; --line-soft:#1a1f28;
  --ink:#eceff5; --ink2:#99a2b2; --ink3:#6d7482;
  --scope:#080a0f; --scope-line:#1d232e; --scope-ink:#cfd6e4; --scope-ink2:#8891a3;
  --sugar:#4d94ef; --bitter:#e06fa4; --motor:#f0793f; --quiet:#7a808c;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.55;
  padding-inline:20px; padding-block:26px 40px;
}
.wrap{max-width:1120px; margin:0 auto; display:flex; flex-direction:column; gap:22px}

header{display:flex; flex-direction:column; gap:9px}
.eyebrow{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ink3);
}
h1{
  margin:0; font-size:clamp(26px,4.3vw,40px); font-weight:600;
  letter-spacing:-.022em; text-wrap:balance; line-height:1.1;
}
.standfirst{
  margin:0; max-width:62ch; color:var(--ink2);
  font-family:"IBM Plex Serif",Georgia,serif; font-size:15.5px; line-height:1.65;
}

/* transport */
.transport{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:12px 14px; background:var(--surface);
  border:1px solid var(--line); border-radius:3px;
}
button.play{
  font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.08em;
  text-transform:uppercase; padding:8px 16px; min-width:92px;
  background:var(--ink); color:var(--paper); border:none; border-radius:2px;
  cursor:pointer;
}
button.play:hover{opacity:.86}
button.play:focus-visible, input:focus-visible{outline:2px solid var(--motor); outline-offset:2px}
input[type=range]{flex:1 1 220px; min-width:160px; accent-color:var(--motor); cursor:pointer}
.clock{
  font-family:"IBM Plex Mono",monospace; font-size:13px; font-variant-numeric:tabular-nums;
  color:var(--ink2); white-space:nowrap;
}
.state{
  font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.08em;
  text-transform:uppercase; padding:5px 10px; border-radius:2px; white-space:nowrap;
  border:1px solid currentColor;
}
.state[data-s="none"]{color:var(--quiet)}
.state[data-s="sugar"]{color:var(--sugar)}
.state[data-s="sugar+bitter"]{color:var(--bitter)}

/* scope panels */
.rig{display:grid; grid-template-columns:1.62fr 1fr; gap:16px; align-items:start}
.views{display:flex; flex-direction:column; gap:16px}
.panel{
  background:var(--scope); border:1px solid var(--scope-line);
  border-radius:3px; overflow:hidden;
}
.panel h2{
  margin:0; padding:9px 12px 7px;
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:500;
  letter-spacing:.11em; text-transform:uppercase; color:var(--scope-ink2);
  border-bottom:1px solid var(--scope-line);
  display:flex; justify-content:space-between; gap:10px;
}
.panel h2 em{font-style:normal; color:var(--scope-ink2); opacity:.7; text-transform:none; letter-spacing:.04em}
.panel canvas{display:block; width:100%; height:auto; max-width:100%}

/* readouts */
.readouts{display:grid; grid-template-columns:1fr 1fr; gap:0; border-top:1px solid var(--scope-line)}
.readout{padding:10px 12px 12px}
.readout + .readout{border-left:1px solid var(--scope-line)}
.readout .k{
  font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--scope-ink2);
}
.readout .v{
  font-family:"IBM Plex Mono",monospace; font-size:24px; font-weight:500;
  font-variant-numeric:tabular-nums; line-height:1.25; color:var(--scope-ink);
}
.readout.motor .v{color:var(--motor)}

/* trace */
.trace-wrap{background:var(--surface); border:1px solid var(--line); border-radius:3px}
.trace-wrap h2{
  margin:0; padding:10px 14px 8px;
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:500;
  letter-spacing:.11em; text-transform:uppercase; color:var(--ink3);
  border-bottom:1px solid var(--line-soft);
}
#trace{display:block; width:100%; height:auto; cursor:crosshair}
.legend{
  display:flex; gap:18px; flex-wrap:wrap; padding:0 14px 12px;
  font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink2);
}
.legend span{display:inline-flex; align-items:center; gap:7px}
.swatch{width:11px; height:11px; border-radius:1px; flex:none}

/* neuron table */
.inspect{background:var(--surface); border:1px solid var(--line); border-radius:3px}
.inspect h2{
  margin:0; padding:10px 14px 8px;
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:500;
  letter-spacing:.11em; text-transform:uppercase; color:var(--ink3);
  border-bottom:1px solid var(--line-soft);
}
table{width:100%; border-collapse:collapse; font-size:13px}
th,td{text-align:left; padding:6px 14px; border-bottom:1px solid var(--line-soft)}
th{
  font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink3); font-weight:500;
}
td.num{
  font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  text-align:right; white-space:nowrap;
}
td.type{font-family:"IBM Plex Mono",monospace; font-size:12.5px}
tr.mn9 td{color:var(--motor)}
tbody tr:last-child td{border-bottom:none}
.tablescroll{overflow-x:auto}

.notes{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:22px 30px}
.notes h3{
  margin:0 0 5px; font-family:"IBM Plex Mono",monospace; font-size:10.5px;
  letter-spacing:.11em; text-transform:uppercase; color:var(--ink3); font-weight:500;
}
.notes p{margin:0; color:var(--ink2); font-size:13.5px; line-height:1.6}
footer{
  border-top:1px solid var(--line); padding-top:14px; color:var(--ink3);
  font-size:12.5px; line-height:1.6;
}
footer a{color:var(--ink2)}
@media (max-width:820px){
  .rig{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important}
}
</style>
